<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的GitHub静态主页</title>
    <!-- 外部引入CSS -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>你好，欢迎访问我的静态网页</h1>
      <p>当前时间：<span id="time"></span></p>
      <p id="tip">点击下面按钮,试试JS交互效果</p>
      <button class="btn" onclick="changeText()">点击更换文字</button>
      <a class="btn" href="https://github.com" target="_blank"
        >访问我的Github</a
      >
    </div>
    <footer>Powered by GitHub Pages</footer>

    <!-- 外部引入JS -->
    <script src="./js/script.js"></script>
  </body>
</html>
